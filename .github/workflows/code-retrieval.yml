name: Code retrieval

# Retrieval-only check of the code-question path on real repositories: for every fixture in Scripts/e2e/code-qa, clone
# the repository, extract and import it into Neo4j with the real ingestion code, and ask each question through
# GraphDbQueryTool. Reports whether the expected definition reaches the answering model's context. No LLM or Jev call
# and no secrets, so it is quick and free; the e2e-code workflow measures full answers. A branch name containing
# "semantic" also embeds each repository's definitions (NVIDIA embeddings, LLM_API_KEY, Chroma) and reports semantic
# search merged in.
#
# How to run: push any commit to a branch named code-retrieval/<anything>, e.g.
#   git push origin HEAD:code-retrieval/check

on:
  workflow_dispatch:
  push:
    branches: ["code-retrieval/**"]

permissions:
  contents: read

concurrency:
  group: code-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build backend/SupportForge.Evals/SupportForge.Evals.csproj --configuration Release

      - name: Wait for Neo4j
        run: |
          for _ in $(seq 60); do curl -s -o /dev/null http://localhost:7474 && exit 0; sleep 2; done
          echo "::error::Neo4j did not start"; exit 1

      - name: Retrieval per fixture
        env:
          CODE_SEMANTIC: ${{ contains(github.ref_name, 'semantic') && '1' || '' }}
          Llm__Provider: NvidiaNim
          Llm__ApiKey: ${{ contains(github.ref_name, 'semantic') && secrets.LLM_API_KEY || '' }}
          # Extra ranking settings scored on the same imports, boost:floor:max each (see CodeRetrievalEval).
          CODE_SEARCH_SWEEP: "0.4:0.65:10,2.0:0.65:10,1.0:0.5:15"
        run: |
          # Embed with the model production uses; the Evals appsettings name chat models only.
          export Llm__NvidiaNim__EmbeddingModel=$(jq -r '.Llm.NvidiaNim.EmbeddingModel' backend/SupportForge.Api/appsettings.json)
          export Llm__NvidiaNim__EmbeddingInputType=$(jq -r '.Llm.NvidiaNim.EmbeddingInputType' backend/SupportForge.Api/appsettings.json)
          evals=backend/SupportForge.Evals/bin/Release/net9.0/SupportForge.Evals.dll
          : > report.md
          for f in Scripts/e2e/code-qa/*.json; do
            repo=$(jq -r .repo "$f"); branch=$(jq -r .branch "$f")
            dir="$RUNNER_TEMP/repos/${repo//\//_}"
            git clone -q --depth 1 --branch "$branch" "https://github.com/$repo.git" "$dir"
            dotnet "$evals" code-retrieval "$f" "$dir" | tee -a report.md
            rm -rf "$dir"
          done
          grep -E '^\*\*|^SWEEP' report.md

      - name: Summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
