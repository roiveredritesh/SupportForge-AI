name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore backend/SupportForge.Backend.sln

      - name: Build
        run: dotnet build backend/SupportForge.Backend.sln --no-restore --configuration Release

      # OpenAI__ApiKey is optional: EndToEndQueryTests.cs is [SkippableFact]-gated on it (plus a
      # live Chroma instance, provided above as a service container). Without the secret
      # configured, that one test still skips gracefully as it always has -- everything else runs.
      - name: Test
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}
        run: dotnet test backend/SupportForge.Backend.sln --no-build --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t supportforge-api:${{ github.sha }} .
