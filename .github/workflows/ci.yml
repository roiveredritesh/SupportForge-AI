name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore backend/SupportForge.Backend.sln

      - name: Build
        run: dotnet build backend/SupportForge.Backend.sln --no-restore --configuration Release

      # OpenAI__ApiKey is optional: EndToEndQueryTests.cs is [SkippableFact]-gated on it (plus a
      # live Chroma instance, provided above as a service container). Without the secret
      # configured, that one test still skips gracefully as it always has -- everything else runs.
      - name: Test
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}
        run: dotnet test backend/SupportForge.Backend.sln --no-build --configuration Release

  # E2 (gap-closing-solutions.md Phase E, item 2): runs the frontend test suite, typecheck, and
  # lint on every push/PR -- previously only the backend .NET suite ran in CI.
  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npx vitest run
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-build-and-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/supportforge-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supportforge-api:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/supportforge-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supportforge-frontend:latest

  # CD: SSH into the Oracle VM and roll the stack to the image just pushed above.
  # Needs three repo secrets: ORACLE_HOST, ORACLE_SSH_USER, ORACLE_SSH_KEY (private
  # key matching a public key already in that user's ~/.ssh/authorized_keys).
  # The VM needs docker-compose.prod.yml and a filled-in .env (see .env.prod.example)
  # already present in ~/supportforge/ — this job only pulls and restarts, it never
  # copies app secrets over SSH.
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    concurrency:
      group: oracle-vm-deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/supportforge
            export GHCR_OWNER=${{ github.repository_owner }}
            export IMAGE_TAG=${{ needs.docker-build.outputs.image-tag }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f

  # C8 (gap-closing-solutions.md Phase C, item 8): packages the artifacts Scripts/Deploy.ps1 expects
  # (backend publish output + frontend dist, with the SPA-routing web.config already written into
  # it) and uploads them as a build artifact. This is the automatable half of "deploy" -- actually
  # pushing to the EC2 host needs real remote-access credentials (WinRM/SSH) this repo doesn't have
  # configured, so that step stays manual (download the artifact, run Deploy.ps1 -TargetRoot against
  # a reachable path) rather than faking a step that would fail or silently no-op in CI.
  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Publish backend
        run: dotnet publish backend/SupportForge.Api -c Release -o publish/api

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Write SPA web.config
        run: |
          cat > frontend/dist/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="React Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportforge-deploy-${{ github.sha }}
          path: |
            publish/api
            frontend/dist
          retention-days: 14
